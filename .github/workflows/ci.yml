name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      compose: false
      run: |
        pip install -q actionlint-py
        actionlint -shellcheck= .github/workflows/*.yml

  auto-merge:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependabot-auto-merge.yml
    permissions:
      contents: write
      pull-requests: write
